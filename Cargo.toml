[package]
name = "aerobox-for-linux"
version = "2.0.2"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "A native Rust proxy application for Linux and Wayland"

[[bin]]
name = "AeroBox"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
sourceview = { package = "sourceview5", version = "0.11.3", features = ["v5_6"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "socks"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
base64 = "0.23.1"
url = "2.5.8"
percent-encoding = "2.3.2"
sha2 = "0.11.1"
libc = "0.2.191"
tempfile = "3.27.0"

shoes = { path = "vendor/shoes" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "sync"] }
log = { version = "0.4.32", features = ["std"] }
thiserror = "2.0.21"

[dev-dependencies]
rcgen = { path = "vendor/rcgen", default-features = false, features = ["rustcrypto", "pem"] }
rustls = { path = "vendor/rustls/rustls", default-features = false, features = ["std", "tls12"] }
aerobox-crypto = { path = "vendor/support/aerobox-crypto" }

[lints.cargo]
unused_dependencies = "deny"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 8

[patch.crates-io]
tendns = { path = "vendor/tendns" }
rustls = { path = "vendor/rustls/rustls" }
blake3 = { path = "vendor/blake3" }
h3 = { path = "vendor/h3/h3" }
h3-quinn = { path = "vendor/h3/h3-quinn" }
hickory-net = { path = "vendor/hickory-dns/crates/net" }
hickory-proto = { path = "vendor/hickory-dns/crates/proto" }
hickory-resolver = { path = "vendor/hickory-dns/crates/resolver" }
nix = { path = "vendor/nix" }
smoltcp = { path = "vendor/smoltcp" }
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
rcgen = { path = "vendor/rcgen" }
gotatun = { path = "vendor/gotatun" }
