[package]
name = "aerobox-for-linux"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "A native sing-box desktop client for Wayland"

[[bin]]
name = "AeroBox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
libc = "0.2"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
