[package]
name = "aerobox-for-linux"
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "A native sing-box desktop client for Wayland"

[[bin]]
name = "AeroBox"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
sourceview = { package = "sourceview5", version = "0.11.3", features = ["v5_6"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "socks"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
base64 = "0.23.1"
url = "2.5.8"
percent-encoding = "2.3.2"
sha2 = "0.11.1"
flate2 = "1.1.11"
tar = "0.4.46"
libc = "0.2.191"
tempfile = "3.27.0"

[lints.cargo]
unused_dependencies = "deny"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
