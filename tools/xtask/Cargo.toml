[package]
name = "aerobox-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "3"

[features]
default = ["tools"]
tools = [
    "dep:syn", "dep:proc-macro2", "dep:anyhow", "dep:serde", "dep:serde_json",
    "dep:tempfile", "dep:flate2", "dep:tar", "dep:sha2", "dep:libc", "dep:toml",
]

[dependencies]
log = { version = "0.4.35", features = ["max_level_off"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"], optional = true }
syn = { version = "2.0.119", features = ["full", "visit"], optional = true }
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
libc = { version = "0.2", optional = true }
toml = { version = "1", optional = true }

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["tools"]

[profile.dev]
debug = 0
