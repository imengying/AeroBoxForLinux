name: AeroBoxForLinux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev librsvg2-common pkg-config weston sway dbus-daemon fonts-noto-cjk
      - name: Check formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        env:
          AEROBOX_VERSION: ${{ github.ref_name }}
        run: cargo build --release --locked
      - name: Test Wayland without X11
        run: timeout 90s scripts/test-wayland.sh
      - name: Test text and layout at 2x display scale
        if: matrix.arch == 'amd64'
        env:
          AEROBOX_TEST_SCALE: "2"
        run: timeout 90s scripts/test-wayland.sh
      - name: Test fractional Wayland scale at 1.25x
        if: matrix.arch == 'amd64'
        env:
          AEROBOX_TEST_SCALE: "1.25"
        run: timeout 90s scripts/test-wayland.sh
      - name: Package
        run: scripts/package.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: target/packages/AeroBoxForLinux-linux-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wayland-${{ matrix.arch }}
          path: target/wayland/

  release:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/AeroBoxForLinux-linux-*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            AeroBox，使用 Rust、GTK4 / libadwaita 的原生 Linux Wayland 客户端。

            删除配置页；导入订阅后直接使用，点击订阅卡片切换，点击节点整行选择并高亮。
            节点页只显示当前订阅的节点，不显示代理组、搜索或路由模式。规则、全局和直连只在首页切换。
            内置与 AeroBoxForAndroid 相同来源的三个 SagerNet 规则集，附带本地初始数据并在线自动更新。
            新增连接诊断，检查本地端口、系统代理和实际 HTTP / HTTPS 请求；修复 Clash Shadowsocks 插件参数导入。
            数据结构重新整理，不迁移旧版数据。旧数据可在启动提示中备份并重置后重新导入订阅。

            Arch Linux 运行依赖：`sudo pacman -S --needed gtk4 libadwaita gtksourceview5 librsvg`
            Intel / AMD 选择 amd64，ARM64 选择 arm64。下载并解压 tar.gz 后运行 `./install.sh`。
            更新后完全退出旧进程，再从应用菜单启动 AeroBox；在设置中下载或指定 sing-box 1.14+ 内核。

            安装与使用说明见 README.md。
