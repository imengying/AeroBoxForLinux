name: AeroBoxForLinux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Rust application build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev librsvg2-common pkg-config weston sway dbus-daemon gsettings-desktop-schemas fonts-noto-cjk nftables libcap2-bin
      - name: Check formatting and lint
        run: |
          cargo fmt --package aerobox-for-linux --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --bin AeroBox --features ui-smoke --locked -- -D warnings
      - name: Check task ownership and protocol state machines
        run: scripts/check-network.sh
      - name: Test
        run: cargo test --locked
      - name: Test network and TLS components
        run: scripts/test-protocols.sh --unit
      - name: Build UI checks
        run: cargo build --bin AeroBox --features ui-smoke --locked
      - name: Test Wayland without X11
        run: timeout 90s scripts/test-wayland.sh
      - name: Test text and layout at 2x display scale
        env:
          AEROBOX_TEST_SCALE: "2"
        run: timeout 90s scripts/test-wayland.sh
      - name: Test fractional Wayland scale at 1.25x
        env:
          AEROBOX_TEST_SCALE: "1.25"
        run: timeout 90s scripts/test-wayland.sh
      - name: Build release without development features
        run: cargo build --release --locked --no-default-features
      - name: Package
        run: |
          scripts/package.sh amd64
          python3 scripts/check-package.py target/packages/AeroBoxForLinux-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: target/packages/AeroBoxForLinux-linux-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wayland-amd64
          path: target/wayland/

  release:
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          name: AeroBox ${{ github.ref_name }}
          files: release-assets/AeroBoxForLinux-linux-amd64.tar.gz
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            AeroBox，使用 Rust、GTK4 / libadwaita 的原生 Linux Wayland 客户端。

            连接、分流、DNS 和 TUN 直接集成在应用中，无需下载或指定外部内核。

            - 清理重复逻辑与未使用接口；连接列表直接传递结构化数据，流量统计、配置遍历和备份恢复减少不必要的内存分配。
            - XHTTP 接入订阅导入与运行，支持 HTTP/1.1、HTTP/2、HTTP/3 及 REALITY HTTP/2；修复 Chrome / Firefox REALITY 握手的密钥共享顺序。
            - HTTP 代理支持 HTTP/2 CONNECT、连接复用和 ALPN 协商回退；UDP-only 节点限制贯穿连接选择与转发。
            - 字体默认跟随桌面，GNOME 文字缩放和窗口按钮布局实时同步；首页启动/停止图标居中。
            - 正式构建支持设置中的 debug / trace 日志等级，默认仍为 error。
            - 应用、协议组件及 Wayland 界面均有回归检查；独立服务端验证使用 sing-box 和 Xray。具体支持范围与限制见协议说明。
            - 安装包只包含程序、图标、安装与卸载脚本，文档和许可证保留在源码仓库。
            - 使用 Rust 1.100，仅发布 AMD64 安装包；在 ubuntu-latest 构建，检查 1 倍、1.25 倍和 2 倍 Wayland 缩放。

            Arch Linux 运行依赖：`sudo pacman -S --needed gtk4 libadwaita gtksourceview5 librsvg`
            安装包适用于 Intel / AMD 的 x86_64 电脑。下载并解压 tar.gz 后运行 `./install.sh`。
            更新后完全退出旧进程，再从应用菜单启动 AeroBox。

            [安装与使用说明](https://github.com/imengying/AeroBoxForLinux/blob/${{ github.ref_name }}/README.md) · [协议与参数说明](https://github.com/imengying/AeroBoxForLinux/blob/${{ github.ref_name }}/docs/protocols.md)
