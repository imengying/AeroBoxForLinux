name: AeroBoxForLinux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev librsvg2-common pkg-config weston sway dbus-daemon fonts-noto-cjk nftables libcap2-bin
      - name: Check formatting and lint
        run: |
          cargo fmt --package aerobox-for-linux --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test network and TLS components
        run: scripts/test-protocols.sh --unit
      - name: Build
        env:
          AEROBOX_VERSION: ${{ github.ref_name }}
        run: cargo build --release --locked
      - name: Test Wayland without X11
        run: timeout 90s scripts/test-wayland.sh
      - name: Test text and layout at 2x display scale
        env:
          AEROBOX_TEST_SCALE: "2"
        run: timeout 90s scripts/test-wayland.sh
      - name: Test fractional Wayland scale at 1.25x
        env:
          AEROBOX_TEST_SCALE: "1.25"
        run: timeout 90s scripts/test-wayland.sh
      - name: Package
        run: scripts/package.sh amd64
      - uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: target/packages/AeroBoxForLinux-linux-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wayland-amd64
          path: target/wayland/

  release:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          name: AeroBox ${{ github.ref_name }}
          files: release-assets/AeroBoxForLinux-linux-amd64.tar.gz
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            AeroBox，使用 Rust、GTK4 / libadwaita 的原生 Linux Wayland 客户端。

            连接、分流、DNS 和 TUN 直接集成在应用中，无需下载或指定外部内核。

            - 支持 Shadowsocks、VMess、VLESS、Trojan、AnyTLS、Hysteria2、TUIC、Naive、SOCKS 和 HTTP，以及相应传输与 TLS 参数。
            - 完善混合协议订阅导入，保留节点参数并显示导入问题；点击订阅或节点卡片即可选用，节点可独立测速。
            - 完善浏览器 TLS、REALITY、ECH、TLS 分片和 Linux kTLS，并修复握手重试校验。
            - 首页统一显示出口 IP、流量与应用内存，集中切换规则、全局和直连；界面支持窄窗口与 1.25 倍缩放。
            - 使用 Rust 1.100；仅发布 AMD64 安装包，在 ubuntu-latest 构建并执行应用、网络组件及 Wayland 回归测试。
            - 修复 SS 等未使用 TLS 的节点因订阅附带 client-fingerprint 而被跳过的问题。
            - 修复规则匹配时 DNS 查询未请求递归解析，导致 Cloudflare 返回 Server Failure 的问题。
            - 修复 Vision 首个标识跨 TLS 记录拆分时丢失数据，以及普通短载荷被吞掉的问题。

            Arch Linux 运行依赖：`sudo pacman -S --needed gtk4 libadwaita gtksourceview5 librsvg`
            安装包适用于 Intel / AMD 的 x86_64 电脑。下载并解压 tar.gz 后运行 `./install.sh`。
            更新后完全退出旧进程，再从应用菜单启动 AeroBox。本版不迁移旧版配置数据；升级前请保留订阅来源。

            安装与使用说明见 README.md，协议支持及参数组合限制见 docs/protocols.md。
