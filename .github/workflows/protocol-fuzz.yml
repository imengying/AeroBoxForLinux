name: Protocol state fuzz

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-fuzz
  cancel-in-progress: false

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/xtask/fuzz -> ../../../target/protocol-fuzz
      - name: Fuzz Vision framing
        run: scripts/fuzz-vision.sh 120
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vision-fuzz-inputs
          path: |
            target/protocol-fuzz/artifacts/
            target/protocol-fuzz/corpus/
          if-no-files-found: ignore
